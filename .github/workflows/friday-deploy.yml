# FRIDAY — phone-triggerable deploy (Product Specification §14; docs/contracts/phone-only.md).
#
# The owner is phone-only, so this workflow is the deploy button. From the GitHub mobile
# app: Actions -> "FRIDAY Deploy" -> Run workflow. It builds the FRIDAY image, pushes it to
# the GitHub Container Registry, and (if a deploy hook is configured) tells the host to
# pull the new image. Nothing needs a laptop.
#
# It also runs on every push to main, so the published image tracks the branch.
name: FRIDAY Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note recorded in the run summary
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve image reference
        id: meta
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # ghcr.io/<owner>/friday:<branch>. Lowercase: GHCR rejects uppercase owner names.
          owner="$(printf '%s' "${REPO%%/*}" | tr '[:upper:]' '[:lower:]')"
          ref="ghcr.io/${owner}/friday:${GITHUB_REF_NAME}"
          echo "image_ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${ref}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-host:
    needs: build-and-publish
    # Only runs when a deploy hook is configured (a repository secret). Without it the
    # owner pulls on the host's own schedule — see deploy/friday/README.md.
    if: ${{ needs.build-and-publish.outputs.image_ref != '' }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Trigger host deploy hook
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
          DEPLOY_HOOK: ${{ secrets.FRIDAY_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK:-}" ]; then
            echo "No FRIDAY_DEPLOY_HOOK secret set; skipping host notification."
            echo "The host will pick up ${IMAGE_REF} on its next scheduled pull."
            exit 0
          fi
          # POST only; the hook body carries the image ref so the host knows what to run.
          curl -fsS -X POST "${DEPLOY_HOOK}" \
            -H "Content-Type: application/json" \
            --data "{\"image\":\"${IMAGE_REF}\"}"
          echo "Notified host to deploy ${IMAGE_REF}."

  summary:
    needs: [build-and-publish, notify-host]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Run summary
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image_ref }}
          REASON: ${{ inputs.reason }}
          BUILD_RESULT: ${{ needs.build-and-publish.result }}
        run: |
          {
            echo "## FRIDAY deploy"
            echo ""
            echo "- Image: \`${IMAGE_REF}\`"
            echo "- Build: ${BUILD_RESULT}"
            [ -n "${REASON:-}" ] && echo "- Note: ${REASON}"
            echo ""
            echo "To deploy on the host (phone): copy the image above into \`deploy/friday/.env\`"
            echo "as \`FRIDAY_IMAGE\`, then restart the FRIDAY service on the host."
          } >> "$GITHUB_STEP_SUMMARY"
